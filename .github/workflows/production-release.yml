name: Production release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zamrescue-production-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check required signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ZAMRESCUE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZAMRESCUE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAMRESCUE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAMRESCUE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Build and sign release candidate
        env:
          KEYSTORE_B64: ${{ secrets.ZAMRESCUE_KEYSTORE_BASE64 }}
          ZAMRESCUE_KEYSTORE_PASSWORD: ${{ secrets.ZAMRESCUE_KEYSTORE_PASSWORD }}
          ZAMRESCUE_KEY_ALIAS: ${{ secrets.ZAMRESCUE_KEY_ALIAS }}
          ZAMRESCUE_KEY_PASSWORD: ${{ secrets.ZAMRESCUE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ZAMRESCUE_KEYSTORE_PATH="$RUNNER_TEMP/zamrescue-release.jks"
          trap 'rm -f "$ZAMRESCUE_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ZAMRESCUE_KEYSTORE_PATH"
          gradle :secure-protocol:test :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain --max-workers=2
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload signed candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ZamRescue-signed-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
